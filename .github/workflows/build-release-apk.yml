name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle & Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/android-sdk/platforms
            ~/android-sdk/build-tools
            ~/android-sdk/platform-tools
          key: ${{ runner.os }}-android36_1-gradle9_3_1-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android36_1-gradle9_3_1-

      - name: Set up Android SDK 36.1 & Command-Line Tools v20
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"

          if [ ! -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading Google Android Command-Line Tools (v20.0)..."
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/cmdline-extract "${SDK_ROOT}/cmdline-tools/latest"
            mkdir -p /tmp/cmdline-extract
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
            chmod +x "${SDK_ROOT}/cmdline-tools/latest/bin/"*
          fi

          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          set -o pipefail

          echo "Installing Android SDK Platform 36.1 & Build-Tools 36.0.0..."
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1 (Direct official distribution, independent of wrapper jar)
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="9.3.1"
          GRADLE_DEST="${RUNNER_TEMP:-/tmp}/gradle-dist"
          if [ ! -x "${GRADLE_DEST}/gradle-${GRADLE_VER}/bin/gradle" ]; then
            echo "Downloading official Gradle ${GRADLE_VER}..."
            mkdir -p "${GRADLE_DEST}"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "${GRADLE_DEST}"
            chmod +x "${GRADLE_DEST}/gradle-${GRADLE_VER}/bin/gradle"
          fi
          echo "${GRADLE_DEST}/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"

      - name: Prepare .env, clean stale local.properties, and configure signing keystores
        shell: bash
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Remove any stale machine-specific local.properties so ANDROID_SDK_ROOT is used
          rm -f "${GITHUB_WORKSPACE}/local.properties"

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f "${GITHUB_WORKSPACE}/.env" ]; then
            if [ -f "${GITHUB_WORKSPACE}/.env.example" ]; then
              cp "${GITHUB_WORKSPACE}/.env.example" "${GITHUB_WORKSPACE}/.env"
            else
              touch "${GITHUB_WORKSPACE}/.env"
            fi
          fi

          # 1. Restore and validate debug.keystore
          DEBUG_KS="${GITHUB_WORKSPACE}/debug.keystore"
          if [ ! -f "$DEBUG_KS" ] && [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            tr -d '[:space:]' < "${GITHUB_WORKSPACE}/debug.keystore.base64" | base64 --decode > "$DEBUG_KS" || rm -f "$DEBUG_KS"
          fi
          if ! keytool -list -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f "$DEBUG_KS"
            keytool -genkeypair -v \
              -keystore "$DEBUG_KS" \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare and validate release keystore (uses GitHub Secrets if set, or generates a working fallback)
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          EFF_STORE_PASS="${RAW_STORE_PASSWORD:-android}"
          EFF_KEY_PASS="${RAW_KEY_PASSWORD:-$EFF_STORE_PASS}"

          if [ -n "${RAW_KEYSTORE_BASE64:-}" ]; then
            echo "${RAW_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE" || rm -f "$KEYSTORE_FILE"
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$EFF_STORE_PASS" -alias upload >/dev/null 2>&1; then
              echo "Using provided release keystore from GitHub Secrets."
            else
              echo "Provided keystore is invalid or missing 'upload' alias; generating fallback keystore..."
              rm -f "$KEYSTORE_FILE"
              EFF_STORE_PASS="android"
              EFF_KEY_PASS="android"
            fi
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating signed release keystore (alias: upload)..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -storepass "$EFF_STORE_PASS" \
              -keypass "$EFF_KEY_PASS" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Fuel Tracker,O=Personal Project,C=IR"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${EFF_STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${EFF_KEY_PASS}" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          gradle --version
          gradle :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Verify and stage Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Release APK was not found!"
            exit 1
          fi
          cp "$APK_SOURCE" "${GITHUB_WORKSPACE}/FuelTracker-v1.0-release.apk"
          echo "Successfully built Release APK: $APK_SOURCE"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelTracker-Release-APK
          path: FuelTracker-v1.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Fuel Tracker {0}', github.ref_name) || format('Fuel Tracker v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: FuelTracker-v1.0-release.apk
          generate_release_notes: true
          make_latest: true
